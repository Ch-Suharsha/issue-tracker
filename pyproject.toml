[project]
name = "issue-triage"
version = "0.1.0"
description = "AI-assisted GitHub issue triage workflow (FDE portfolio)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.0",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.9",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.0.0",
    "typesafe-sdk>=0.7.0",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
issue-triage = "issue_triage.main:run"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.build-backend]
module-root = "src"
module-name = "issue_triage"
source-exclude = ["issue_triage/web_templates/**"]
wheel-exclude = ["issue_triage/web_templates/**"]
