<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Issue Triage{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      /* Linear-inspired: charcoal, monochrome, color only for meaning */
      :root {
        --bg: #0f0f10;
        --bg-elevated: #151516;
        --bg-hover: #1a1a1c;
        --border: #262626;
        --border-light: #1e1e1e;
        --text: #ececec;
        --text-secondary: #80848c;
        --text-tertiary: #5c5f66;
        --link: #c4cacc;
        --policy: #947c0c;
        --policy-bg: rgba(148, 124, 12, 0.1);
        --success: #4ade80;
        --success-bg: rgba(74, 222, 128, 0.08);
        --danger: #f87171;
        --danger-bg: rgba(248, 113, 113, 0.08);
        --font: "Inter", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        --mono: ui-monospace, "SF Mono", Menlo, monospace;
        --radius: 6px;
        --max: 1120px;
      }

      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: var(--font);
        font-size: 14px;
        line-height: 1.5;
        color: var(--text);
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
      }

      a { color: var(--link); text-decoration: none; }
      a:hover { color: var(--text); }

      .app {
        max-width: var(--max);
        margin: 0 auto;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Top bar */
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 48px;
        padding: 0 20px;
        border-bottom: 1px solid var(--border-light);
        flex-shrink: 0;
      }
      .topbar-brand {
        font-size: 13px;
        font-weight: 500;
        color: var(--text-secondary);
        letter-spacing: -0.01em;
      }
      .topbar-brand a { color: inherit; }
      .topbar-brand a:hover { color: var(--text); }
      .topbar-tag {
        font-size: 11px;
        font-weight: 500;
        color: var(--text-tertiary);
        padding: 2px 8px;
        border: 1px solid var(--border);
        border-radius: 4px;
      }
      .topbar-tag.demo { color: var(--policy); border-color: rgba(148, 124, 12, 0.35); }

      .main { padding: 24px 20px 48px; flex: 1; }

      /* Notices */
      .notice {
        padding: 10px 12px;
        margin-bottom: 20px;
        font-size: 13px;
        color: var(--text-secondary);
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: var(--radius);
      }
      .notice strong { color: var(--text); font-weight: 500; }
      .notice-error { border-color: rgba(248, 113, 113, 0.35); background: var(--danger-bg); color: #fca5a5; }
      .notice-policy {
        border-left: 3px solid var(--policy);
        background: var(--policy-bg);
        border-radius: 0 var(--radius) var(--radius) 0;
        margin: 16px 0;
      }

      /* Section labels — sentence case, quiet */
      .section-label {
        font-size: 12px;
        font-weight: 500;
        color: var(--text-tertiary);
        margin: 0 0 10px;
      }

      /* Forms */
      .field { margin-bottom: 12px; }
      label {
        display: block;
        font-size: 12px;
        color: var(--text-tertiary);
        margin-bottom: 4px;
      }
      input[type=text], textarea, select {
        width: 100%;
        padding: 8px 10px;
        font: inherit;
        font-size: 13px;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
      }
      input:focus, textarea:focus, select:focus {
        outline: none;
        border-color: #404040;
      }
      textarea { resize: vertical; min-height: 88px; }

      .btn {
        display: inline-block;
        padding: 6px 12px;
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        background: var(--bg-elevated);
        color: var(--text);
        cursor: pointer;
      }
      .btn:hover:not(:disabled) { background: var(--bg-hover); border-color: #333; }
      .btn:disabled { opacity: 0.4; cursor: not-allowed; }
      .btn-primary {
        background: var(--text);
        color: var(--bg);
        border-color: var(--text);
      }
      .btn-primary:hover:not(:disabled) { background: #d4d4d4; border-color: #d4d4d4; }
      .btn-danger { color: var(--danger); border-color: rgba(248, 113, 113, 0.3); background: transparent; }

      /* Intake row — compact, not card-heavy */
      .intake-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        margin-bottom: 32px;
        padding-bottom: 32px;
        border-bottom: 1px solid var(--border-light);
      }
      @media (max-width: 720px) { .intake-row { grid-template-columns: 1fr; } }

      /* Inbox list — Linear-style rows */
      .inbox-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .inbox-header h2 {
        margin: 0;
        font-size: 13px;
        font-weight: 500;
        color: var(--text-secondary);
      }
      .inbox-count { font-size: 12px; color: var(--text-tertiary); }

      .inbox-list { list-style: none; margin: 0; padding: 0; }
      .inbox-item {
        display: grid;
        grid-template-columns: 48px 1fr auto auto;
        gap: 12px;
        align-items: center;
        padding: 10px 8px;
        margin: 0 -8px;
        border-radius: var(--radius);
        border-bottom: 1px solid var(--border-light);
      }
      .inbox-item:hover { background: var(--bg-hover); }
      .inbox-item:last-child { border-bottom: none; }
      @media (max-width: 640px) {
        .inbox-item { grid-template-columns: 40px 1fr; }
        .inbox-item .col-status, .inbox-item .col-action { display: none; }
      }

      .inbox-id {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--text-tertiary);
      }
      .inbox-title {
        font-size: 13px;
        font-weight: 500;
        color: var(--text);
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .inbox-title a { color: inherit; }
      .inbox-title a:hover { color: var(--link); }

      .status {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--text-tertiary);
        white-space: nowrap;
      }
      .status-awaiting_approval { color: var(--policy); }
      .status-dry_run_recorded { color: var(--success); }
      .status-failed, .status-rejected { color: var(--danger); }

      .action {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--text-tertiary);
        min-width: 64px;
        text-align: right;
      }

      .empty-state {
        padding: 32px 8px;
        color: var(--text-tertiary);
        font-size: 13px;
      }

      /* Review — split pane */
      .review-back {
        font-size: 12px;
        color: var(--text-tertiary);
        margin-bottom: 20px;
      }
      .review-back a { color: var(--text-tertiary); }
      .review-back a:hover { color: var(--text-secondary); }

      .review-title {
        margin: 0 0 4px;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.025em;
        line-height: 1.3;
      }
      .review-meta {
        font-size: 12px;
        color: var(--text-tertiary);
        font-family: var(--mono);
        margin-bottom: 24px;
      }

      .review-split {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 32px;
        align-items: start;
      }
      @media (max-width: 768px) { .review-split { grid-template-columns: 1fr; gap: 24px; } }

      .issue-body {
        margin: 0;
        padding: 12px;
        font-size: 13px;
        line-height: 1.6;
        color: var(--text-secondary);
        background: var(--bg-elevated);
        border: 1px solid var(--border-light);
        border-radius: var(--radius);
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 360px;
        overflow-y: auto;
      }

      .proposal-table { width: 100%; border-collapse: collapse; font-size: 13px; }
      .proposal-table td {
        padding: 8px 0;
        border-bottom: 1px solid var(--border-light);
        vertical-align: top;
      }
      .proposal-table tr:last-child td { border-bottom: none; }
      .proposal-table .k { width: 88px; color: var(--text-tertiary); font-size: 12px; }
      .proposal-table .v { color: var(--text); font-weight: 500; text-align: right; }

      .reasoning {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid var(--border-light);
        font-size: 12px;
        line-height: 1.55;
        color: var(--text-secondary);
      }

      .decision-panel {
        margin-top: 28px;
        padding-top: 28px;
        border-top: 1px solid var(--border-light);
      }
      .decision-fields {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 12px;
      }
      @media (max-width: 640px) { .decision-fields { grid-template-columns: 1fr; } }
      .decision-actions { display: flex; gap: 8px; flex-wrap: wrap; }

      .dry-run-block {
        margin-top: 28px;
        padding: 12px;
        background: var(--bg-elevated);
        border: 1px solid var(--border-light);
        border-radius: var(--radius);
      }
      .dry-run-block pre {
        margin: 8px 0 0;
        font-size: 12px;
        color: var(--text-secondary);
        white-space: pre-wrap;
        line-height: 1.5;
      }
      .dry-run-meta { font-size: 12px; color: var(--text-tertiary); font-family: var(--mono); }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="topbar-brand"><a href="/">Issue Triage</a></div>
        {% if demo_mode %}
        <span class="topbar-tag demo">Public demo</span>
        {% endif %}
      </header>

      <main class="main">
        {% if demo_mode %}
        <div class="notice">
          <strong>Public demo</strong> — {{ demo_mode_message }}
        </div>
        {% endif %}

        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
