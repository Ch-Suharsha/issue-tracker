<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Issue Triage{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #09090b;
        --surface: #131316;
        --surface-raised: #1a1a1f;
        --border: #27272a;
        --border-subtle: #1f1f23;
        --text: #fafafa;
        --text-muted: #a1a1aa;
        --text-dim: #71717a;
        --accent: #6366f1;
        --accent-soft: rgba(99, 102, 241, 0.12);
        --policy: #f59e0b;
        --policy-soft: rgba(245, 158, 11, 0.12);
        --success: #22c55e;
        --success-soft: rgba(34, 197, 94, 0.12);
        --danger: #ef4444;
        --danger-soft: rgba(239, 68, 68, 0.12);
        --warn: #eab308;
        --radius: 10px;
        --radius-sm: 6px;
        --shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 8px 32px rgba(0,0,0,0.35);
        --max: 1080px;
        --section-gap: clamp(72px, 10vw, 120px);
        --font: "Inter", system-ui, -apple-system, sans-serif;
        --mono: ui-monospace, "SF Mono", Menlo, monospace;
      }

      *, *::before, *::after { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        font-family: var(--font);
        font-size: 15px;
        line-height: 1.55;
        color: var(--text);
        background: var(--bg);
        background-image:
          radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99, 102, 241, 0.15), transparent),
          radial-gradient(ellipse 60% 40% at 100% 0%, rgba(245, 158, 11, 0.06), transparent);
        min-height: 100vh;
      }

      a { color: var(--accent); text-decoration: none; }
      a:hover { text-decoration: underline; }

      .shell {
        max-width: var(--max);
        margin: 0 auto;
        padding: 0 1.25rem 4rem;
      }

      /* Header */
      .site-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1.25rem 0;
        border-bottom: 1px solid var(--border-subtle);
        margin-bottom: 2.5rem;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        font-weight: 600;
        font-size: 0.95rem;
        letter-spacing: -0.02em;
        color: var(--text);
        text-decoration: none;
      }
      .brand:hover { text-decoration: none; }
      .brand-mark {
        width: 28px;
        height: 28px;
        border-radius: 7px;
        background: linear-gradient(135deg, var(--accent), #818cf8);
        display: grid;
        place-items: center;
        font-size: 0.7rem;
        font-weight: 700;
        color: white;
        box-shadow: 0 0 20px rgba(99, 102, 241, 0.35);
      }
      .header-meta { display: flex; align-items: center; gap: 0.5rem; }

      /* Badges & pills */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.2rem 0.55rem;
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        border: 1px solid transparent;
      }
      .badge-live { background: var(--success-soft); color: var(--success); border-color: rgba(34,197,94,0.25); }
      .badge-demo { background: var(--policy-soft); color: var(--policy); border-color: rgba(245,158,11,0.25); }
      .badge-policy { background: var(--policy-soft); color: #fbbf24; border-color: rgba(245,158,11,0.35); font-size: 0.78rem; text-transform: none; letter-spacing: 0; padding: 0.45rem 0.75rem; border-radius: var(--radius-sm); }
      .status-pill {
        display: inline-block;
        padding: 0.18rem 0.5rem;
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 500;
        font-family: var(--mono);
        background: var(--surface-raised);
        color: var(--text-muted);
        border: 1px solid var(--border);
      }
      .status-awaiting_approval { color: var(--policy); background: var(--policy-soft); border-color: rgba(245,158,11,0.3); }
      .status-dry_run_recorded { color: var(--success); background: var(--success-soft); border-color: rgba(34,197,94,0.3); }
      .status-failed, .status-rejected { color: var(--danger); background: var(--danger-soft); border-color: rgba(239,68,68,0.3); }
      .status-classified { color: #818cf8; background: var(--accent-soft); border-color: rgba(99,102,241,0.3); }

      /* Hero */
      .hero {
        margin-bottom: var(--section-gap);
        max-width: 640px;
      }
      .hero-eyebrow {
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent);
        margin: 0 0 0.75rem;
      }
      .hero h1 {
        margin: 0 0 0.85rem;
        font-size: clamp(1.85rem, 4vw, 2.65rem);
        font-weight: 700;
        letter-spacing: -0.035em;
        line-height: 1.12;
      }
      .hero-lead {
        margin: 0;
        font-size: 1.05rem;
        color: var(--text-muted);
        max-width: 52ch;
      }

      /* Pipeline strip — the "aha" moment */
      .pipeline {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
        align-items: center;
        margin: 2rem 0 0;
        padding: 0;
        list-style: none;
      }
      .pipeline li {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        font-size: 0.78rem;
        font-weight: 500;
        color: var(--text-dim);
      }
      .pipeline li strong { color: var(--text-muted); font-weight: 600; }
      .pipeline .step-num {
        width: 1.35rem;
        height: 1.35rem;
        border-radius: 50%;
        background: var(--surface-raised);
        border: 1px solid var(--border);
        display: grid;
        place-items: center;
        font-size: 0.65rem;
        font-family: var(--mono);
        color: var(--text-muted);
      }
      .pipeline li.highlight .step-num {
        background: var(--policy-soft);
        border-color: rgba(245,158,11,0.4);
        color: var(--policy);
      }
      .pipeline .arrow { color: var(--border); font-size: 0.7rem; user-select: none; }

      /* Layout */
      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1.15fr;
        gap: 1.5rem;
        align-items: start;
      }
      @media (max-width: 820px) {
        .grid-2 { grid-template-columns: 1fr; }
      }

      /* Cards */
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.35rem 1.4rem;
        box-shadow: var(--shadow);
      }
      .card + .card { margin-top: 1rem; }
      .card-title {
        margin: 0 0 1rem;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-dim);
      }
      .card-note {
        margin: 0.85rem 0 0;
        font-size: 0.85rem;
        color: var(--text-dim);
      }

      /* Forms */
      label {
        display: block;
        font-size: 0.82rem;
        font-weight: 500;
        color: var(--text-muted);
        margin-bottom: 0.35rem;
      }
      input[type=text], textarea, select {
        width: 100%;
        padding: 0.6rem 0.75rem;
        font: inherit;
        font-size: 0.92rem;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      input[type=text]:focus, textarea:focus, select:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      textarea { resize: vertical; min-height: 120px; }
      .field { margin-bottom: 0.85rem; }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        padding: 0.55rem 1rem;
        font: inherit;
        font-size: 0.88rem;
        font-weight: 600;
        border-radius: var(--radius-sm);
        border: 1px solid transparent;
        cursor: pointer;
        transition: background 0.15s, opacity 0.15s;
      }
      .btn-primary {
        background: var(--accent);
        color: white;
        box-shadow: 0 1px 2px rgba(0,0,0,0.2), 0 0 20px rgba(99,102,241,0.25);
      }
      .btn-primary:hover:not(:disabled) { background: #5558e8; }
      .btn-ghost {
        background: transparent;
        color: var(--text-muted);
        border-color: var(--border);
      }
      .btn-ghost:hover:not(:disabled) { background: var(--surface-raised); color: var(--text); }
      .btn-danger { background: var(--danger-soft); color: #fca5a5; border-color: rgba(239,68,68,0.35); }
      .btn:disabled { opacity: 0.45; cursor: not-allowed; }
      .btn-row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }

      /* Table / inbox */
      .inbox-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.88rem;
      }
      .inbox-table th {
        text-align: left;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--text-dim);
        padding: 0 0 0.65rem;
        border-bottom: 1px solid var(--border);
      }
      .inbox-table td {
        padding: 0.75rem 0.5rem 0.75rem 0;
        border-bottom: 1px solid var(--border-subtle);
        vertical-align: middle;
      }
      .inbox-table tr:last-child td { border-bottom: none; }
      .inbox-table tr:hover td { background: rgba(255,255,255,0.02); }
      .issue-id { font-family: var(--mono); font-size: 0.82rem; color: var(--text-dim); }
      .issue-title { font-weight: 500; color: var(--text); }
      .issue-title a { color: inherit; text-decoration: none; }
      .issue-title a:hover { color: var(--accent); }
      .action-tag {
        font-family: var(--mono);
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      /* Alerts */
      .alert {
        padding: 0.85rem 1rem;
        border-radius: var(--radius-sm);
        margin-bottom: 1.25rem;
        font-size: 0.88rem;
        border: 1px solid;
      }
      .alert-error { background: var(--danger-soft); border-color: rgba(239,68,68,0.35); color: #fca5a5; }
      .alert-demo { background: var(--policy-soft); border-color: rgba(245,158,11,0.3); color: #fcd34d; }

      /* Review page */
      .review-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.25rem;
        align-items: start;
      }
      @media (max-width: 820px) { .review-grid { grid-template-columns: 1fr; } }

      .issue-body {
        margin: 0;
        padding: 1rem;
        background: var(--bg);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-sm);
        font-size: 0.88rem;
        line-height: 1.6;
        color: var(--text-muted);
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 320px;
        overflow-y: auto;
      }
      .proposal-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .proposal-list li {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.55rem 0;
        border-bottom: 1px solid var(--border-subtle);
        font-size: 0.88rem;
      }
      .proposal-list li:last-child { border-bottom: none; }
      .proposal-list .label { color: var(--text-dim); font-size: 0.78rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; }
      .proposal-list .value { font-weight: 500; text-align: right; }
      .reasoning-box {
        margin-top: 0.85rem;
        padding: 0.75rem;
        background: var(--bg);
        border-left: 3px solid var(--accent);
        border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
        font-size: 0.82rem;
        color: var(--text-muted);
        line-height: 1.5;
      }
      .dry-run {
        margin-top: 1.25rem;
        padding: 1rem;
        background: var(--bg);
        border: 1px dashed var(--border);
        border-radius: var(--radius-sm);
      }
      .dry-run pre {
        margin: 0.5rem 0 0;
        padding: 0.75rem;
        background: var(--surface);
        border-radius: var(--radius-sm);
        font-size: 0.8rem;
        color: var(--text-muted);
        white-space: pre-wrap;
        overflow-x: auto;
      }
      .breadcrumb {
        font-size: 0.82rem;
        color: var(--text-dim);
        margin-bottom: 1.25rem;
      }
      .breadcrumb a { color: var(--text-muted); }
      .page-title { margin: 0 0 0.25rem; font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; }
      .meta-line { font-size: 0.82rem; color: var(--text-dim); margin: 0 0 1.25rem; font-family: var(--mono); }

      section + section { margin-top: var(--section-gap); }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="site-header">
        <a class="brand" href="/">
          <span class="brand-mark">IT</span>
          Issue Triage
        </a>
        <div class="header-meta">
          {% if demo_mode %}
          <span class="badge badge-demo">Public demo</span>
          {% else %}
          <span class="badge badge-live">Live · Jev</span>
          {% endif %}
        </div>
      </header>

      {% if demo_mode %}
      <div class="alert alert-demo">
        <strong>Public demo</strong> — {{ demo_mode_message }}
      </div>
      {% endif %}

      {% block content %}{% endblock %}
    </div>
  </body>
</html>
