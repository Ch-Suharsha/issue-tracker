# Render Blueprint — issue-triage (live Jev + full workflow)
# AFTER apply: paste DATABASE_URL and TYPESAFE_API_KEY in Render dashboard (sync: false below).
# See docs/deploy.md.

services:
  - type: web
    name: issue-triage
    runtime: python
    plan: free
    buildCommand: curl -LsSf https://astral.sh/uv/install.sh | sh && export PATH="$HOME/.local/bin:$PATH" && uv sync
    startCommand: uv run uvicorn issue_triage.app:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DEMO_MODE
        value: "false"
      - key: JEV_MIN_CONFIDENCE
        value: "0.5"
      - key: DATABASE_URL
        sync: false
      - key: TYPESAFE_API_KEY
        sync: false
